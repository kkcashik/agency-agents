<body>
<div id="stage"></div>
<script src="node_modules/roughjs/bundled/rough.js"></script>
<script>
/* ============ utils ============ */
const MODE = new URLSearchParams(location.search).get('v') || '75';
const clamp=x=>x<0?0:x>1?1:x, eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const P=(t,a,d)=>eo(clamp((t-a)/d)), Lin=(t,a,d)=>clamp((t-a)/d);
const lerp=(a,b,k)=>a+(b-a)*k;
const NS='http://www.w3.org/2000/svg';
function el(tag,cls,html,css,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(css)Object.assign(e.style,css);if(parent)parent.appendChild(e);return e}
function sv(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
const stage=document.getElementById('stage');
let rs=7; const rnd=()=>{rs|=0;rs=rs+0x6D2B79F5|0;let t=Math.imul(rs^rs>>>15,1|rs);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

/* ============ rough doodle layer ============ */
const gen=rough.generator();
let sd=11;
const O=e=>Object.assign({roughness:1.4,bowing:1.1,strokeWidth:3.5,seed:(sd+=13)},e||{});
const ext=(x1,y1,x2,y2,os)=>{const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy)||1;return[x1-dx/l*os,y1-dy/l*os,x2+dx/l*os,y2+dy/l*os]};
const line=(x1,y1,x2,y2,os=3,e)=>gen.line(...ext(x1,y1,x2,y2,os),O(e));
const box=(x,y,w,h,os=3,e)=>[line(x,y,x+w,y,os,e),line(x+w,y,x+w,y+h,os,e),line(x+w,y+h,x,y+h,os,e),line(x,y+h,x,y,os,e)];
const rpath=(d,e)=>gen.path(d,O(e));
const HAIR={strokeWidth:1.6,roughness:.9};
function rrect(w,h,r){return `M${r+4} 0 L${w-r} 0 Q${w} 0 ${w} ${r} L${w} ${h-r} Q${w} ${h} ${w-r} ${h} L${r} ${h} Q0 ${h} 0 ${h-r} L0 ${r} Q0 0 ${r+10} -3`}

/* groups: array of arrays of drawables. returns {svg,groups:[{g,paths}]} */
function doodle(S,c){
  const svg=sv('svg',{width:c.w,height:c.h,viewBox:`0 0 ${c.w} ${c.h}`},S.el);
  Object.assign(svg.style,{position:'absolute',left:c.x+'px',top:c.y+'px',rotate:(c.rot||0)+'deg'});
  let washEl=null;
  if(c.wash){washEl=sv('path',{d:c.wash.d,fill:'rgba(75,66,200,.08)'},svg);washEl.style.opacity=0}
  const out={svg,groups:[],wash:washEl};
  c.groups.forEach((gr,gi)=>{
    const g=sv('g',{},svg), paths=[];
    gr.flat().forEach(dr=>{
      gen.toPaths(dr).forEach(pp=>{
        const hair=(pp.strokeWidth||3.5)<2.2;
        const pe=sv('path',{d:pp.d,fill:'none',stroke:'var(--ink)','stroke-width':pp.strokeWidth,'stroke-linecap':'round','stroke-linejoin':'round',opacity:hair?.5:1},g);
        pe.style.transformBox='fill-box';pe.style.transformOrigin='center';
        pe.style.rotate=((rnd()<.5?-1:1)*(1+rnd()))+'deg';
        paths.push({el:pe,len:pe.getTotalLength()});
      });
    });
    out.groups.push({g,paths,at:c.at+gi*(c.stag??.12),dur:c.dur||1});
  });
  S.tick(lt=>{
    out.groups.forEach(G=>{const k=P(lt,G.at,G.dur);G.paths.forEach(p=>{p.el.style.strokeDasharray=p.len+' '+(p.len+2);p.el.style.strokeDashoffset=p.len*(1-k)});
      G.g.style.opacity=lt<G.at?0:1});
    if(washEl)washEl.style.opacity=P(lt,c.wash.at,.8);
  });
  return out;
}

/* ============ scene class ============ */
class Scene{
  constructor(start,end,name){this.start=start;this.end=end;this.name=name;this.el=el('div','sc',null,null,stage);this.ticks=[]}
  tick(fn){this.ticks.push(fn)}
  fade(e,at,{d=.5,rise=16,x=0}={}){e.style.opacity=0;this.tick(lt=>{const p=P(lt,at,d);e.style.opacity=p;e.style.translate=`${(1-p)*x}px ${(1-p)*rise}px`})}
  add(cls,html,css,at,o){const e=el('div',cls,html,Object.assign({position:'absolute'},css),this.el);if(at!=null)this.fade(e,at,o);return e}
  hl(html,at,{size=56,top=440,center=false}={}){
    const e=this.add('hl',html,{fontSize:size+'px',top:top+'px'},at,{d:.6,rise:20});
    if(center){Object.assign(e.style,{left:0,right:0,textAlign:'center'})}return e}
  cap(html,at){const c=el('div','cap',`<span>${html}</span>`,null,this.el);this.fade(c,at,{d:.45,rise:12});return c}
  label(html,at,css){return this.add('lbl mono',html,Object.assign({left:0,right:0,textAlign:'center'},css),at,{d:.5,rise:10})}
}
const scenes=[];
function mk(start,end,name,fn,o){const S=new Scene(start,end,name);scenes.push(S);fn(S,o||{});return S}

/* ============ THE RING ============ */
const RING_LABELS=['FOUND','CAPTURED','NURTURED','BOOKED','REMINDED','REVIEWED','RECALLED'];
const ring={el:null,act:[],close:null,t9:null,fadeOut:null,cx:540,cy:300,R:100,nodes:[],arcs:[],labels:[],base:null,g:null};
function ringBuild(){
  const svg=sv('svg',{width:1080,height:1920,viewBox:'0 0 1080 1920'},stage);
  Object.assign(svg.style,{position:'absolute',left:0,top:0,pointerEvents:'none',overflow:'visible'});
  ring.el=svg; const g=sv('g',{},svg); ring.g=g;
  const base=gen.circle(0,0,200,{roughness:1.1,bowing:1,strokeWidth:1.5,seed:5});
  gen.toPaths(base).forEach(pp=>{ring.base=sv('path',{d:pp.d,fill:'none',stroke:'#9AA6BA','stroke-width':1.5,'vector-effect':'non-scaling-stroke','stroke-linecap':'round'},g)});
  const ang=k=>(-90+k*360/7)*Math.PI/180, R=ring.R;
  const pt=k=>[R*Math.cos(ang(k)),R*Math.sin(ang(k))];
  for(let k=1;k<=7;k++){const a=pt(k-1),b=pt(k%7);
    const a1=sv('path',{d:`M${a[0]} ${a[1]} A${R} ${R} 0 0 1 ${b[0]} ${b[1]}`,fill:'none',stroke:'var(--indigo)','stroke-width':2.5,'stroke-linecap':'round',pathLength:1},g);
    a1.style.strokeDasharray='1 2';ring.arcs.push(a1)}
  for(let k=0;k<7;k++){const [x,y]=pt(k),c=Math.cos(ang(k)),s=Math.sin(ang(k));
    const n=sv('circle',{cx:x,cy:y,r:7,fill:'none',stroke:'var(--ink)','stroke-width':1.5,'vector-effect':'non-scaling-stroke'},g);
    const lx=(R+22)*c,ly=(R+22)*s;
    const t=sv('text',{x:lx,y:ly+(s>.3?10:s<-.3?0:4),'text-anchor':c>.3?'start':c<-.3?'end':'middle','font-family':'IBM Plex Mono','font-size':14,'letter-spacing':'0.14em',fill:'var(--ink)','font-weight':500},g);
    t.textContent=RING_LABELS[k]; ring.nodes.push(n);ring.labels.push(t)}
}
function ringUpdate(t){
  const T=ring; let op=1;
  if(T.fadeOut!=null)op=1-P(t,T.fadeOut,.4);
  T.el.style.opacity=Math.min(op,P(t,0,.6));
  let s=1,cy=T.cy;
  if(T.t9!=null){const k=eio(Lin(t,T.t9,.9));s=lerp(1,2.2,k);cy=lerp(T.cy,900,k)}
  T.g.setAttribute('transform',`translate(${T.cx} ${cy}) scale(${s})`);
  const allLit=T.t9!=null?P(t,T.t9,.4):0;
  let pulse=0;
  if(T.close!=null){const k=Lin(t,T.close+.8,.4);pulse=k>0&&k<1?Math.sin(k*Math.PI):0}
  T.base.setAttribute('stroke-width',1.5+pulse);
  for(let k=0;k<7;k++){
    const ta=T.act[k]; const next=k<6?T.act[k+1]:(T.t9??1e9);
    let fill=0,r=7,opN=.3,opL=.3;
    if(ta!=null&&t>=ta){const p=P(t,ta,.4);fill=1;r=lerp(7,9,p);
      const done=P(t,next,.4);          // becomes "completed" when next node activates
      opN=lerp(1,.5,done);opL=lerp(.3,1,p)*lerp(1,.55,done);}
    opN=lerp(opN,1,allLit);opL=lerp(opL,1,allLit);
    if(ta!=null&&t>=ta&&t<next&&!allLit){r=lerp(7,9,P(t,ta,.4))}
    else if(allLit&&k<7){r=lerp(r,9,allLit)}
    const n=T.nodes[k];
    n.setAttribute('r',r);
    n.setAttribute('fill',fill||allLit?'var(--indigo)':'none');
    n.setAttribute('fill-opacity',opN);
    n.setAttribute('stroke','var(--ink)');
    n.setAttribute('stroke-opacity',fill||allLit?0:.3);
    T.labels[k].setAttribute('opacity',opL);
    // arc into node k (arc index k-1), arc 6 closes RECALLED -> FOUND
  }
  for(let a=0;a<7;a++){
    let p=0,o=.55;
    if(a<6){const ta=T.act[a+1];if(ta!=null){p=P(t,ta,.6)}}
    else if(T.close!=null){p=P(t,T.close,.8)}
    if(a<6){const nxt=a<5?T.act[a+2]:T.t9;const done=nxt!=null?P(t,nxt,.4):0;o=lerp(1,.55,done)}
    else o=1;
    if(T.t9!=null&&a<6)o=lerp(o,1,allLit);
    T.arcs[a].style.strokeDashoffset=1-p;
    T.arcs[a].setAttribute('stroke-opacity',o);
    T.arcs[a].setAttribute('stroke-width',(2.5+pulse)/s);
  }
}

/* ============ SCENES ============ */
function sceneTrigger(S,o){
  S.hl('Somebody needs<br>a dentist <em>tonight.</em>',.3,{size:76,top:470});
  // phone
  const X=390,Y=800,W=300,H=540;
  const d=doodle(S,{x:X,y:Y,w:W,h:H,rot:5,at:1.0,dur:1.0,stag:.18,
    wash:{d:`M24 62 H276 V420 H24Z`,at:2.0},
    groups:[[rpath(rrect(W,H,34))],[...box(24,62,252,358,3)],[box(38,96,224,52,2,{})].flat().concat([]),[line(110,30,190,30,3)]]});
  // search field UI
  const f=el('div',null,null,{position:'absolute',left:X+'px',top:Y+'px',width:W+'px',height:H+'px',rotate:'5deg'},S.el);
  const field=el('div',null,'',{position:'absolute',left:'44px',top:'104px',width:'212px',height:'36px',font:'400 16.5px Karla',color:'var(--ink)',display:'flex',alignItems:'center',whiteSpace:'nowrap',overflow:'hidden'},f);
  const TXT='dentist near me open now';
  S.tick(lt=>{const k=Lin(lt,2.4,1.2);const n=Math.floor(k*TXT.length);const caret=(lt>2.2&&Math.floor(lt*2.2)%2==0&&k<1)||k>=1&&k<1.0001;
    field.innerHTML=TXT.slice(0,n)+`<span style="display:inline-block;width:2px;height:20px;background:var(--ink);margin-left:2px;opacity:${lt>2.2&&(k<1||Math.floor(lt*2)%2==0)?1:0}"></span>`});
  S.add('mono','21:19',{left:'700px',top:'790px',fontSize:'30px',color:'var(--slate)',fontWeight:'400'},2.0,{d:.5});

}

function sceneTraffic(S,o){
  const k=o.k||1, a=x=>x*k;
  S.hl('First they have<br>to <em>find</em> you.',.2,{size:56,top:440});
  const items=[['Ads management','We build and tune them weekly. Budget goes where patients are searching.'],['Google Business Profile','Photos, services, hours, review replies — kept sharp.'],['Local SEO','A page for every treatment and neighbourhood.'],['AEO · AI answers','So ChatGPT, Gemini and AI search recommend you.']];
  const TOP=700,H=118,G=16,mid=i=>TOP+i*(H+G)+H/2;
  items.forEach((it,i)=>{
    const e=el('div','card abs',`<div style="font:500 34px Karla;margin-bottom:6px">${it[0]}</div><div style="font:300 25px/1.25 Karla;color:var(--slate)">${it[1]}</div>`,{left:'90px',top:TOP+i*(H+G)+'px',width:'600px',height:H+'px',padding:'16px 30px',display:'flex',flexDirection:'column',justifyContent:'center'},S.el);
    S.fade(e,a(.8+i*.55),{d:.4,rise:16})});
  const bx=735, oy=(mid(0)+mid(3))/2;
  const stubs=[0,1,2,3].map(i=>line(692,mid(i),bx,mid(i),3));
  doodle(S,{x:0,y:0,w:1080,h:1920,rot:0,at:a(3.2),dur:.8,stag:.12,groups:[stubs,[line(bx,mid(0),bx,mid(3),4)],[line(bx,oy,800,oy,0),line(786,oy-14,802,oy,0),line(786,oy+14,802,oy,0)]]});
  const out=el('div','card abs',`<div style="font:500 32px/1.15 Karla;margin-bottom:10px">Found<br>first</div><div style="font:300 24px/1.25 Karla;color:var(--slate)">More calls. More new patients.</div>`,{left:'812px',top:oy-140+'px',width:'190px',height:'280px',padding:'22px 20px',borderColor:'var(--ink)'},S.el);
  S.fade(out,a(4.4),{d:.5,rise:14});
  S.label('we run all four · you run the clinic',a(5.2),{top:'1250px'});
  S.cap('Ads, profile, search, AI — <b>all managed.</b>',a(1.0));
}
function sceneFound(S,o){
  S.hl('So you start<br>showing up <em>higher.</em>',.2,{size:56,top:440});
  const rows=[['1','Westside Dental',4.8,212],['2','Bloor Family Dental',4.7,186],['3','Lakeview Dental',4.6,143],['4','Parkdale Dental',4.5,98]];
  const TOP=700,H=96,GAP=16,slot=i=>TOP+i*(H+GAP);
  const mkRow=(n,name,r,rv,at)=>{
    const e=el('div','card abs',`<span class="mono n" style="width:60px;font-size:26px;color:var(--slate)">${n}</span><span style="font:500 34px Karla;flex:1">${name}</span><span class="mono rt" style="font-size:30px;font-weight:500">${r.toFixed(1)}</span><span class="mono rv" style="font-size:26px;margin-left:22px;width:110px;text-align:right">★ ${rv}</span>`,
      {left:'90px',width:'900px',height:H+'px',top:slot(0)+'px',display:'flex',alignItems:'center',padding:'0 30px'},S.el);
    S.fade(e,at,{d:.35,rise:14});return e};
  const els=rows.map((r,i)=>mkRow(r[0],r[1],r[2],r[3],.6+i*.2));
  const you=mkRow('7','Your clinic',3.5,15,.6+4*.2);
  const bar=el('div','abs',null,{left:0,top:'14px',bottom:'14px',width:'6px',borderRadius:'3px',background:'var(--sage)',opacity:0},you);
  S.tick(lt=>{
    const p=eio(Lin(lt,4,.9)), q=P(lt,4,.9);
    els.forEach((e,i)=>{const sl=i+(i>=1?p:0);e.style.top=slot(sl)+'px';e.querySelector('.n').textContent=(i>=1&&p>.5)?i+2:i+1});
    you.style.top=slot(4-3*p)+'px';
    you.querySelector('.n').textContent=Math.round(7-5*q);
    you.querySelector('.rt').textContent=(3.5+1.1*q).toFixed(1);
    you.querySelector('.rv').textContent='★ '+Math.round(15+79*q);
    you.style.color=`rgb(${Math.round(lerp(118,43,q))},${Math.round(lerp(131,52,q))},${Math.round(lerp(154,68,q))})`;
    you.querySelector('.n').style.color='inherit';
    bar.style.opacity=q; you.style.borderColor=`rgba(111,168,126,${q})`;
  });
  
  S.cap('Better ranking. <b>More clicks.</b>',1.0);
}
function sceneCaptured(S,o){

  const CX=80,CY=640,CW=680,CH=560;
  const card=S.add('card',null,{left:CX+'px',top:CY+'px',width:CW+'px',height:CH+'px'},.4,{d:.5,rise:20});
  S.add('mono','21:21',{left:CX+40+'px',top:CY+30+'px',fontSize:'26px',color:'var(--slate)'},.5);
  // call circle + pulses
  const cx=CX+40,cy=CY+100;
  const circ=el('div',null,`<svg width="30" height="30" viewBox="0 0 24 24"><path fill="#fff" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>`,{position:'absolute',left:cx+'px',top:cy+'px',width:'72px',height:'72px',borderRadius:'50%',background:'var(--ink)',display:'flex',alignItems:'center',justifyContent:'center'},S.el);

  S.tick(lt=>pulses.forEach((p,i)=>{const k=Lin(lt,.5+i*.5,.55);p.style.opacity=k>0&&k<1?(1-k)*.9:0;p.style.scale=1+k*1.5}));

  // lines slide into folder
  S.tick(lt=>lel.forEach((e,i)=>{const k=eio(Lin(lt,5.0+i*.15,.8));if(k>0){const dx=(FX+40)-(CX+40),dy=(FY+80)-(CY+300+i*76);
    e.style.translate=`${dx*k}px ${dy*k}px`;e.style.scale=1-.6*k;e.style.opacity=1-Math.max(0,(k-.7)/.3)}}));
  S.label('in your system before they hang up',6.0,{top:'1250px'});
  S.cap('Answered at <b>9:21pm.</b> Details captured.',1.0);
}
function sceneNurtured(S,o){
  S.hl('Most aren\'t<br>ready <em>today.</em>',.2,{size:56,top:440});
  const SPX=300,TOP=720;
  const items=[
    {tag:'Day 0',txt:'“Here\'s that booking link whenever you\'re ready.”',y:TOP,h:130,tint:false},

// build-time: all scenes visible so getTotalLength works; hidden by render()
window.render=function(t){
  ringUpdate(t);
  scenes.forEach(S=>{
    const on=t>=S.start&&t<S.end;
    S.el.style.display=on?'block':'none';
    if(!on)return;
    const lt=t-S.start;
    S.el.style.opacity=(S.name==='trigger'||true)?1-Lin(lt,S.end-S.start-.12,.12)*(S.name==='cta'?0:1):1;

  // ring sits above scenes except CTA (it fades out)
};
